# Site settings
# He incluido tu nombre completo y el corto en el título para captar ambas búsquedas
title: "Oriac Gimeno Lozano (Oriac Gimeno) – Data & ML Portfolio"
# 146 characters. Bing flagged the previous one as too long: it ran to 175, and
# both Bing and Google cut the snippet around 160. Same wording, minus the
# redundant "(Oriac Gimeno)" and the word "specializing".
