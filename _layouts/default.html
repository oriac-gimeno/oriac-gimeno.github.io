<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  {{ content_for_head }}
  {% include custom-head.html %}
</head>
<body style="background-color: #f8f9fa; margin: 0; padding: 0;">

  <div class="w-100 shadow-sm" style="
      background: url('{{ site.baseurl }}/assets/images/banner-linkedin.jpg.png') no-repeat center center;
      background-size: cover;
      aspect-ratio: 1584 / 396; 
      border-bottom: 4px solid #0055FF;">
  </div>

  <div class="container position-relative" style="margin-top: -80px; z-index: 10;">
    <div class="row align-items-end">
      <div class="col-auto">
        <img src="{{ site.baseurl }}/assets/images/meva-foto.png" 
             alt="Oriac Gimeno" 
             class="rounded-circle border border-4 border-white shadow"
             style="width: 160px; height: 160px; object-fit: cover; background-color: white;">
      </div>
    </div>
  </div>

  <main class="container py-4">
    {{ content }}
  </main>

  <footer class="container py-5 mt-5 border-top text-center text-muted">
    <p>© 2026 Oriac Gimeno Lozano | Data Strategist & Business Leader</p>
  </footer>

</body>
</html>
