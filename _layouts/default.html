<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  {{ content_for_head }}
  {% include custom-head.html %}
</head>
<body style="background-color: #f8f9fa;">

  <header style="background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('{{ site.baseurl }}/assets/images/banner-linkedin.jpg.png') no-repeat center center; background-size: cover; padding: 60px 0; border-bottom: 4px solid #007bff;">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-3 text-center mb-3 mb-md-0">
          <img src="{{ site.baseurl }}/assets/images/meva-foto.png" 
               alt="Oriac Gimeno" 
               style="width: 160px; height: 160px; border-radius: 50%; border: 5px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.3); object-fit: cover;">
        </div>
        
        <div class="col-md-9 text-center text-md-start text-white">
          <h1 style="font-weight: 800; font-size: 2.8rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.7); margin-bottom: 5px;">
            Oriac Gimeno Lozano
          </h1>
          <p style="font-size: 1.3rem; font-weight: 500; text-shadow: 1px 1px 5px rgba(0,0,0,0.7); margin-bottom: 10px;">
            Business Development Director | GTM Strategy & Commercial Excellence
          </p>
          <div class="d-flex flex-wrap justify-content-center justify-content-md-start gap-2">
            <span class="badge bg-primary" style="font-size: 0.9rem; padding: 8px 15px;">Data Translator</span>
            <span class="badge bg-dark" style="font-size: 0.9rem; padding: 8px 15px;">B2B Commercial Strategy</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container py-5">
    {{ content }}
  </main>

</body>
</html>
